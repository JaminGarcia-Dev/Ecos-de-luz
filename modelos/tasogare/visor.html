<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasogare · Guardián del Ocaso</title>
<style>*{box-sizing:border-box}body{margin:0;background:#262e39;color:#eee6d8;font:14px system-ui}canvas{display:block}aside{position:absolute;top:24px;left:24px;display:grid;gap:10px;width:220px;padding:16px;border-radius:12px;background:#111a24da}h1{margin:0;font-size:23px}label{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px}select,button{background:#34434f;color:#fff;border:1px solid #647482;border-radius:6px;padding:8px;width:100%}small{color:#d2bca8}input{width:100%;accent-color:#d47045}footer{position:absolute;bottom:20px;left:24px}</style>
<aside><h1>Tasogare</h1><small>Forma normal · 2,40 m</small><select id="anim"><option value="">Pose de referencia</option></select><button id="ataque">Ver ataque completo</button><label>Ojo <input id="ojo" type="range" min="0" max="2" step=".05" value="1"></label><label>Filo <input id="filo" type="range" min="0" max="2" step=".05" value="1"></label><label>Brasa <input id="brasa" type="range" min="0" max="2" step=".05" value="1"></label><label>Partículas <input id="particulas" type="checkbox" checked></label><label>Oscuridad <input id="oscuro" type="range" min="0" max="1" step=".05" value="0"></label><button id="girar">Girar modelo</button><small>Arrastra para girar.<br>Rueda para acercar.<br>El ojo rojo es su izquierdo.</small></aside><footer id="estado">Cargando GLB…</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../../herramientas/vendor/GLTFLoader-r128.js"></script>
<script>
const escena=new THREE.Scene();escena.background=new THREE.Color(0x262e39);
const cam=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,60),render=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});render.setSize(innerWidth,innerHeight);render.setPixelRatio(Math.min(2,devicePixelRatio));render.outputEncoding=THREE.sRGBEncoding;render.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(render.domElement);
escena.add(new THREE.HemisphereLight(0xcadfff,0x4b3230,1));for(const [x,y,z,c,i]of [[3,5,4,0xffe3be,2],[-4,4,-3,0xa5c8ff,2.2]]){const l=new THREE.DirectionalLight(c,i);l.position.set(x,y,z);escena.add(l);}
const piso=new THREE.Mesh(new THREE.CircleGeometry(4,80),new THREE.MeshStandardMaterial({color:new THREE.Color(0x1d2633).convertSRGBToLinear(),roughness:1}));piso.rotation.x=-Math.PI/2;piso.position.y=-.005;escena.add(piso);
let modelo,mixer,clips=[],accion,angulo=0,elevacion=.24,distancia=5.3,auto=false,ultimo=performance.now(),manual=false,secuencia=-1,etapa=0;
const materiales=new Set(),originales=new Map();
function vista(a,e=elevacion,d=distancia){angulo=a;elevacion=e;distancia=d;cam.position.set(Math.sin(a)*distancia,1.2+Math.sin(e)*distancia,Math.cos(a)*distancia);cam.lookAt(0,1.25,0);render.render(escena,cam);}
function pose(nombre,t=0){secuencia=-1;anim.value=nombre||'';mixer.stopAllAction();if(nombre){const c=THREE.AnimationClip.findByName(clips,nombre);accion=mixer.clipAction(c).reset();accion.setLoop(['Reposo','Caminar'].includes(nombre)?THREE.LoopRepeat:THREE.LoopOnce,1);accion.clampWhenFinished=true;accion.play();mixer.setTime(t);}modelo.updateMatrixWorld(true);}
function emisiones(){for(const m of materiales){const base=originales.get(m);m.color.copy(base.color).multiplyScalar(1-.7*+oscuro.value);if(m.name==='Emision_ojo_izquierdo')m.emissiveIntensity=base.em*+ojo.value;if(m.name==='Emision_filo')m.emissiveIntensity=base.em*+filo.value;if(['Emision_brasa','Capa_carbon_brasa'].includes(m.name))m.emissiveIntensity=base.em*+brasa.value;}}
new THREE.GLTFLoader().load('tasogare.glb',g=>{modelo=g.scene;escena.add(modelo);clips=g.animations;mixer=new THREE.AnimationMixer(modelo);modelo.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material])materiales.add(m);});for(const m of materiales)originales.set(m,{color:m.color.clone(),em:m.emissiveIntensity});for(const c of clips){const op=document.createElement('option');op.value=op.textContent=c.name;anim.appendChild(op);}estado.textContent='GLB · nueve animaciones · ojo izquierdo rojo';tasogareVisor.listo=true;vista(0);},undefined,e=>estado.textContent=e.message);
anim.onchange=()=>pose(anim.value);for(const c of [ojo,filo,brasa,oscuro])c.oninput=emisiones;girar.onclick=()=>auto=!auto;
ataque.onclick=()=>{pose('Preparar_ataque');secuencia=0;etapa=0;};
// Las brasas se dibujan como partículas, sin añadir geometría al personaje exportado.
const pos=new Float32Array(72*3),vidas=new Float32Array(72),vel=new Float32Array(72*3);pos.fill(1000);const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));const puntos=new THREE.Points(pg,new THREE.PointsMaterial({color:0xff6b35,size:.022,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending}));escena.add(puntos);
function brasas(dt){puntos.visible=particulas.checked;if(!puntos.visible||manual)return;for(let i=0;i<72;i++){const k=i*3;vidas[i]-=dt;if(vidas[i]<=0){vidas[i]=1+Math.random()*2;pos[k]=(Math.random()-.5)*1.7;pos[k+1]=.2+Math.random()*.7;pos[k+2]=-.45-Math.random()*.25;vel[k]=(Math.random()-.5)*.12;vel[k+1]=.15+Math.random()*.2;vel[k+2]=(Math.random()-.5)*.1;}for(let j=0;j<3;j++)pos[k+j]+=vel[k+j]*dt;}pg.attributes.position.needsUpdate=true;}
let drag=false,px=0,py=0;render.domElement.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;render.domElement.setPointerCapture(e.pointerId);};render.domElement.onpointerup=()=>drag=false;render.domElement.onpointermove=e=>{if(drag){angulo-=(e.clientX-px)*.01;elevacion=THREE.MathUtils.clamp(elevacion+(e.clientY-py)*.008,-1.2,1.2);px=e.clientX;py=e.clientY;vista(angulo);}};render.domElement.onwheel=e=>{distancia=THREE.MathUtils.clamp(distancia+e.deltaY*.003,2.8,10);vista(angulo);};onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();render.setSize(innerWidth,innerHeight);vista(angulo);};
window.tasogareVisor={listo:false,vista,pose,manual:v=>manual=v,emisiones,verificar:()=>clips.map(c=>{
  pose(c.name);accion.setLoop(THREE.LoopOnce,1);let valido=true,maximo=0;const v=new THREE.Vector3();
  for(let i=0;i<=60;i++){mixer.setTime(c.duration*i/60);modelo.updateMatrixWorld(true);modelo.traverse(o=>{if(!o.matrixWorld.elements.every(Number.isFinite))valido=false;if(o.isSkinnedMesh){o.skeleton.update();const p=o.geometry.attributes.position;for(let j=0;j<p.count;j+=Math.max(1,Math.floor(p.count/120))){v.fromBufferAttribute(p,j);o.boneTransform(j,v);if(!v.toArray().every(Number.isFinite))valido=false;maximo=Math.max(maximo,Math.abs(v.x),Math.abs(v.y),Math.abs(v.z));}}});}
  return{nombre:c.name,duracion:c.duration,valido:valido&&maximo<5,extensionMaxima:+maximo.toFixed(3)};
})};
function cuadro(t){const dt=Math.min((t-ultimo)/1000,.05);ultimo=t;if(!manual&&mixer){mixer.update(dt);if(secuencia>=0){etapa+=dt;const lista=[['Preparar_ataque',.8],['Corte',.4],['Recuperacion',1]];if(etapa>lista[secuencia][1]){const siguiente=secuencia+1;if(siguiente<lista.length){pose(lista[siguiente][0]);secuencia=siguiente;etapa=0;}else secuencia=-1;}}}brasas(dt);if(auto)angulo+=dt*.25;vista(angulo);requestAnimationFrame(cuadro);}requestAnimationFrame(cuadro);
</script></html>
